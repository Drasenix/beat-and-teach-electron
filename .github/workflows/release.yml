name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libfuse2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libfuse2

      - name: Extract version from tag
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set version for build
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('release/app/package.json','utf8'));p.version=process.env.APP_VERSION;fs.writeFileSync('release/app/package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install dependencies
        run: npm ci

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:ci

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/build/*.AppImage
            release/build/*.exe
            release/build/*.dmg
            release/build/*-mac.zip
